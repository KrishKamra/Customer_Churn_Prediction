name: 📉 Model regression / drift
description: Flag metric drift, latency spikes, calibration problems or prediction discrepancies.
title: "[Model]: "
labels: ["model", "regression", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for anything that suggests the **production model** is wrong, slower or
        less reliable than documented in `docs/benchmarks.md` / `models/model_metadata.json`.
  - type: dropdown
    id: kind
    attributes:
      label: Regression type
      options:
        - Metric degradation (PR-AUC / ROC-AUC / recall)
        - Calibration drift (Brier, reliability)
        - Data / schema drift
        - Inference latency spike
        - Prediction discrepancy (unexpected score for a known profile)
        - Fairness concern
    validations:
      required: true
  - type: input
    id: model_version
    attributes:
      label: Model version
      description: "`model_version` from models/model_metadata.json or the dashboard sidebar."
      placeholder: "2.0.0+20261102.elasticnet_lr"
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Expected vs. observed
      description: Documented baseline vs. what you measured, with sample size and data window.
      value: |
        | Metric | Documented | Observed | n / window |
        | :--- | :---: | :---: | :---: |
        | PR-AUC |  |  |  |
        | Recall @ threshold |  |  |  |
        | Brier |  |  |  |
        | Latency (ms, p50) |  |  |  |
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Commands run, notebook cells, plots, or an anonymised example payload.
        Please run `uv run python -m src.models.evaluate --validate-thresholds --json` and paste the output.
      render: shell
  - type: textarea
    id: data
    attributes:
      label: Data context
      description: Did the input distribution change (new plans, pricing, regions)? Any schema changes?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included any personally identifiable customer data.
          required: true
