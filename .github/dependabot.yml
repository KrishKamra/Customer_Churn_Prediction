version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ml-stack:
        patterns: ["scikit-learn", "xgboost", "lightgbm", "catboost", "shap", "imbalanced-learn"]
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
