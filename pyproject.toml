[project]
name = "churn-ai"
version = "2.0.0"
description = "Production-grade customer churn prediction and statistical intelligence platform."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Krish Kamra" }]
requires-python = ">=3.11,<3.14"
keywords = ["churn", "machine-learning", "xgboost", "catboost", "shap", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "shap>=0.45.0",
    "joblib>=1.3.2",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "sqlalchemy>=2.0.28",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
]
notebooks = [
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
]
postgres = [
    "psycopg[binary]>=3.1.18",
]

[project.scripts]
churnai-train = "src.models.train:main"
churnai-evaluate = "src.models.evaluate:main"

[project.urls]
Repository = "https://github.com/KrishKamra/Customer_Churn_Prediction"
Documentation = "https://github.com/KrishKamra/Customer_Churn_Prediction/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# ML convention: capitalised design matrices (X, X_train, ...).
"src/**/*.py" = ["N803", "N806"]
"tests/**/*.py" = ["N803", "N806"]
"notebooks/*.ipynb" = ["E402", "N816", "E501"]
# Embedded stylesheet: CSS lines are not Python.
"src/ui/styles.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/ui/*"]
